{% extends "website/base.html" %}

{% block title %}Book Appointment | Mehndi By Dhruvi{% endblock %}

{% block content %}

<section class="booking-page">

    <div class="booking-box">

        <div class="booking-heading">

            <div class="booking-icon">
                <i class="fas fa-calendar-check"></i>
            </div>

            <p class="small-title">Book Your Appointment</p>

            <h1>Book Your Mehndi Appointment</h1>

            <p>
                Fill in the details below and we will contact you shortly.
            </p>

        </div>

        <form method="POST" class="booking-form">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn booking-submit">
                <i class="fas fa-calendar-check"></i>
                Book Now
            </button>

        </form>

    </div>

</section>

{% endblock %}
